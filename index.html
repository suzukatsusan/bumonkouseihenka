<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八王子食品 - チャネル戦略シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 500: '#22c55e' }, accent: { 400: '#facc15' } } } }
    }
  </script>
  <style>
    input[type=range]::-webkit-slider-thumb {
      appearance: none; height: 20px; width: 20px; border-radius: 50%;
      background: #16a34a; cursor: pointer; box-shadow: 0 0 2px rgba(0,0,0,0.3);
    }
    input[type=range]:focus { outline: none; }
    .slider-warning::-webkit-slider-thumb { background: #ef4444 !important; }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-50/50 via-slate-50 to-amber-50/30 text-slate-800 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const BASE_TOTAL_SALES = 55.0; 
    const BASE_RATIOS = { existing: 0.80, commercial: 0.15, coop: 0.05 };

    const COST_RATES = {
      existing: { name: "既存事業", variableTotal: 0.645, get marginalTotal() { return 1 - 0.645; } },
      commercial: { name: "業務用", variableTotal: 0.520, get marginalTotal() { return 1 - 0.520; } },
      coop: { name: "生協・通販", variableTotal: 0.520, get marginalTotal() { return 1 - 0.520; } }
    };

    const FIXED_COSTS = { mfg: 14.00, depreciation: 0.40, hq: 5.00, get total() { return 14.00 + 0.40 + 5.00; } };

    function App() {
      const [totalSales, setTotalSales] = useState(BASE_TOTAL_SALES);
      const [ratios, setRatios] = useState({ ...BASE_RATIOS });

      const currentTotalRatioPercent = Math.round((ratios.existing + ratios.commercial + ratios.coop) * 100);
      const isRatioValid = currentTotalRatioPercent === 100;

      const handleRatioChange = (changedKey, newValuePercent) => {
        const val = Number(newValuePercent) / 100;
        setRatios(prev => ({ ...prev, [changedKey]: val }));
      };

      const handleSalesInputChange = (e) => {
        let val = parseFloat(e.target.value);
        if(isNaN(val)) val = 0;
        setTotalSales(val);
      };

      const handleReset = () => {
        setTotalSales(BASE_TOTAL_SALES);
        setRatios({ ...BASE_RATIOS });
      };

      const calculateScenario = (sales, rat) => {
        const chSales = {
          existing: sales * rat.existing,
          commercial: sales * rat.commercial,
          coop: sales * rat.coop,
        };
        const chMarginal = {
          existing: chSales.existing * COST_RATES.existing.marginalTotal,
          commercial: chSales.commercial * COST_RATES.commercial.marginalTotal,
          coop: chSales.coop * COST_RATES.coop.marginalTotal,
        };
        
        const marginalProfit = chMarginal.existing + chMarginal.commercial + chMarginal.coop;
        
        const currentTotalRatio = rat.existing + rat.commercial + rat.coop;
        let chFixed = { existing: 0, commercial: 0, coop: 0 };
        if (currentTotalRatio > 0) {
          chFixed = {
            existing: FIXED_COSTS.total * (rat.existing / currentTotalRatio),
            commercial: FIXED_COSTS.total * (rat.commercial / currentTotalRatio),
            coop: FIXED_COSTS.total * (rat.coop / currentTotalRatio),
          };
        }

        const calcTotalSales = chSales.existing + chSales.commercial + chSales.coop;
        const fixedTotal = FIXED_COSTS.total;
        const operatingProfit = marginalProfit - fixedTotal;

        const chOpProfit = {
          existing: chMarginal.existing - chFixed.existing,
          commercial: chMarginal.commercial - chFixed.commercial,
          coop: chMarginal.coop - chFixed.coop,
        };

        return { sales: calcTotalSales, sliderSales: sales, chSales, chMarginal, marginalProfit, fixedTotal, operatingProfit, chFixed, chOpProfit };
      };

      const baseResult = useMemo(() => calculateScenario(BASE_TOTAL_SALES, BASE_RATIOS), []);
      const currentResult = useMemo(() => calculateScenario(totalSales, ratios), [totalSales, ratios]);

      const profitDiff = currentResult.operatingProfit - baseResult.operatingProfit;
      const salesDiff = currentResult.sales - baseResult.sales;

      // 要因分析の計算
      const baseMpRate = baseResult.marginalProfit / baseResult.sales;
      const currentMpRate = currentResult.sales > 0 ? currentResult.marginalProfit / currentResult.sales : 0;
      
      const volumeImpact = salesDiff * baseMpRate;
      const mixImpact = currentResult.sales * (currentMpRate - baseMpRate);

      const fmt = (num) => num.toFixed(1);
      const fmtInt = (num) => Math.round(num).toString();
      const fmtDiff = (num) => {
        const val = num.toFixed(1);
        if (num > 0.001) return `+${val}`;
        if (num < -0.001) return `${val}`;
        return `±0.0`;
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 relative">
          <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-emerald-200 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded">八王子食品</span>
                <span className="bg-accent-400 text-slate-900 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1">★ 利益体質をつくる</span>
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold text-slate-800 mt-2">チャネル戦略シミュレーター (要因分析版)</h1>
              <p className="text-sm text-slate-600 mt-1">限界利益率の高い製品シェアを上げると、全体利益がどう良くなるか直感的に理解しよう！</p>
            </div>
            <button onClick={handleReset} className="self-start md:self-auto px-4 py-2 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-2 transition z-10">
              🔄 初期状態に戻す
            </button>
          </header>

          {!isRatioValid && (
            <div className="mb-8 p-4 bg-red-50 border border-red-300 rounded-xl shadow-md flex items-start gap-4 animate-pulse">
              <span className="text-3xl">⚠️</span>
              <div>
                <h3 className="text-lg font-bold text-red-700">チャネル構成比の合計が {currentTotalRatioPercent}% になっています！</h3>
                <p className="text-sm text-red-600 mt-1 font-medium">手動で数値を調整して、合計が必ず100%になるようにしてください。</p>
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-5 space-y-6">
              <div className={`bg-white rounded-2xl shadow-sm border p-6 transition-colors ${!isRatioValid ? 'border-red-400 ring-2 ring-red-100' : 'border-emerald-100'}`}>
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">パラメータ手動変更</h2>
                  <span className={`text-xs px-2 py-0.5 rounded font-bold ${!isRatioValid ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>合計: {currentTotalRatioPercent}%</span>
                </div>

                <div className="mb-6 p-4 bg-emerald-50/60 rounded-xl border border-emerald-100">
                  <div className="flex justify-between items-end mb-2">
                    <label className="text-sm font-bold text-slate-700">全社売上高 (目標)</label>
                  </div>
                  <div className="flex items-center gap-3">
                    <input type="range" min="30" max="90" step="0.5" value={totalSales} onChange={(e) => setTotalSales(Number(e.target.value))} className="w-full h-2 bg-emerald-200 rounded-lg appearance-none cursor-pointer" />
                    <div className="flex items-center gap-1 shrink-0">
                      <input type="number" step="0.1" value={totalSales} onChange={handleSalesInputChange} className="w-20 px-2 py-1 text-base border border-slate-300 rounded text-right font-bold focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none" />
                      <span className="text-sm font-bold text-emerald-700">億円</span>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <div className="flex justify-between items-end mb-1">
                    <label className="text-sm font-bold text-slate-700">チャネル別 構成比率</label>
                  </div>

                  {[{ id: 'existing', name: '既存事業', color: 'blue', data: COST_RATES.existing },
                    { id: 'commercial', name: '業務用', color: 'amber', data: COST_RATES.commercial },
                    { id: 'coop', name: '生協・通販', color: 'emerald', data: COST_RATES.coop }].map(ch => (
                    <div key={ch.id} className={`p-3 bg-slate-50 rounded-xl border ${ch.id==='coop'?'border-emerald-200 bg-emerald-50/50':'border-slate-200'}`}>
                      <div className="flex justify-between items-center mb-2">
                        <div className="flex items-center gap-2">
                          <span className={`w-2.5 h-2.5 rounded-full bg-${ch.color}-500`}></span>
                          <span className="text-sm font-bold text-slate-800">{ch.name}</span>
                          <span className={`text-[11px] px-1.5 py-0.5 rounded font-bold ${ch.data.marginalTotal > 0.4 ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-700'}`}>限界利益率: {(ch.data.marginalTotal * 100).toFixed(1)}%</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                        <input type="range" min="0" max="100" step="1" value={ratios[ch.id] * 100} onChange={(e) => handleRatioChange(ch.id, e.target.value)} className={`w-full h-2 bg-${ch.color}-100 rounded-lg appearance-none cursor-pointer ${!isRatioValid ? 'slider-warning' : ''}`} />
                        <div className="flex items-center gap-1 shrink-0">
                          <input type="number" step="1" value={Math.round(ratios[ch.id] * 100)} onChange={(e) => handleRatioChange(ch.id, e.target.value)} className="w-16 px-1.5 py-1 text-sm border border-slate-300 rounded text-right font-bold outline-none" />
                          <span className="text-xs text-slate-500 font-bold">%</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className={`p-5 rounded-2xl border transition-all ${!isRatioValid ? "bg-slate-100 border-slate-300 opacity-60 grayscale" : mixImpact > 0.3 ? "bg-gradient-to-r from-emerald-100 to-amber-100 border-emerald-300 shadow-md" : mixImpact < -0.3 ? "bg-red-50 border-red-200" : "bg-white border-slate-200"}`}>
                <div className="flex items-start gap-3">
                  <div className="text-2xl mt-0.5">{!isRatioValid ? "🛑" : mixImpact > 0.3 ? "🌟" : "💡"}</div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-800">
                      {!isRatioValid ? "合計を100%にしてください" : mixImpact > 0.3 ? "高収益体質にシフトしています！" : "利益率(構成比)を意識してみましょう"}
                    </h3>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      限界利益率の高い「業務用」や「生協・通販」のシェアを増やすと、全体の売上が同じでも利益が大きく残る（率変化影響額がプラスになる）ことを確認してください！
                    </p>
                  </div>
                </div>
              </div>
            </div>

            <div className={`lg:col-span-7 space-y-6 transition-all duration-300 ${!isRatioValid ? 'opacity-30 pointer-events-none blur-[2px]' : ''}`}>
              
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <div className="text-xs text-slate-500 font-semibold">全社売上高</div>
                  <div className="text-2xl font-black text-slate-800 mt-1">{fmt(currentResult.sales)}<span className="text-xs font-normal text-slate-500 ml-1">億円</span></div>
                  <div className={`text-xs font-bold mt-1 ${salesDiff >= 0 ? "text-emerald-600" : "text-red-500"}`}>対初期: {fmtDiff(salesDiff)}億円</div>
                </div>
                <div className={`p-4 rounded-xl border shadow-sm ${currentResult.operatingProfit >= 0 ? "bg-emerald-50/80 border-emerald-300" : "bg-red-50/80 border-red-300"}`}>
                  <div className="text-xs text-slate-600 font-semibold">全社営業利益</div>
                  <div className={`text-2xl font-black mt-1 ${currentResult.operatingProfit >= 0 ? "text-emerald-700" : "text-red-600"}`}>{fmt(currentResult.operatingProfit)}<span className="text-xs font-normal text-slate-500 ml-1">億円</span></div>
                  <div className={`text-xs font-extrabold mt-1 ${profitDiff >= 0 ? "text-emerald-700" : "text-red-600"}`}>対初期: {fmtDiff(profitDiff)}億円</div>
                </div>
              </div>

              {/* 要因分析エリア */}
              <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 className="text-sm font-bold text-slate-800 flex items-center gap-2 mb-4"><span className="w-2 h-2 bg-blue-600 rounded-sm"></span>なぜ利益が増減したのか？（営業利益 増減の要因分析）</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="p-3.5 rounded-lg border border-slate-100 bg-slate-50">
                    <div className="text-[11px] font-bold text-slate-600 mb-1">① 売上規模の増減による影響</div>
                    <div className="text-sm font-bold text-slate-700 mb-2">売上高影響額</div>
                    <div className={`text-2xl font-black ${volumeImpact >= 0 ? 'text-blue-600' : 'text-red-500'}`}>{fmtDiff(volumeImpact)} <span className="text-xs font-normal text-slate-500">億円</span></div>
                    <div className="mt-3 text-[10px] text-slate-500 bg-white p-2 rounded border border-slate-100 leading-tight">
                      <span className="font-semibold text-slate-700">計算式:</span><br/>(現在売上 - 初期売上) × 初期限界利益率<br/>
                      = ({fmt(currentResult.sales)} - {fmt(baseResult.sales)}) × {fmt(baseMpRate*100)}%
                    </div>
                  </div>
                  <div className={`p-3.5 rounded-lg border ${mixImpact > 0 ? 'border-amber-300 bg-amber-50/50' : mixImpact < 0 ? 'border-red-200 bg-red-50/30' : 'border-slate-100 bg-slate-50'}`}>
                    <div className="text-[11px] font-bold text-slate-600 mb-1 flex justify-between items-center">② 構成比(利益率)の変化による影響 {mixImpact > 0 && <span className="bg-amber-200 text-amber-800 px-1 py-0.5 rounded text-[9px] font-black">GOOD!</span>}</div>
                    <div className="text-sm font-bold text-slate-700 mb-2">率変化影響額</div>
                    <div className={`text-2xl font-black ${mixImpact > 0 ? 'text-amber-600' : mixImpact < 0 ? 'text-red-600' : 'text-slate-600'}`}>{fmtDiff(mixImpact)} <span className="text-xs font-normal text-slate-500">億円</span></div>
                    <div className="mt-3 text-[10px] text-slate-500 bg-white p-2 rounded border border-slate-100 leading-tight">
                      <span className="font-semibold text-slate-700">計算式:</span><br/>現在売上 × (現在限界利益率 - 初期限界利益率)<br/>
                      = {fmt(currentResult.sales)} × ({fmt(currentMpRate*100)}% - {fmt(baseMpRate*100)}%)
                    </div>
                  </div>
                </div>
                <div className="mt-3 text-right text-xs font-bold text-slate-700 bg-slate-100 py-1.5 px-3 rounded inline-block float-right">
                  増減額 合計: ① {fmtDiff(volumeImpact)} ＋ ② {fmtDiff(mixImpact)} ＝ <span className="text-sm">{fmtDiff(profitDiff)} 億円</span>
                </div>
                <div className="clear-both"></div>
              </div>

              {/* チャネル別 比較表 */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-3 bg-slate-50/80 border-b border-slate-200">
                  <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">チャネル別 業績比較表</h3>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs text-left">
                    <thead className="bg-slate-100/70 text-slate-600 border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-3 font-semibold">チャネル</th>
                        <th className="py-2.5 px-2 text-right font-semibold">売上高<br/>(構成比)</th>
                        <th className="py-2.5 px-2 text-right font-semibold">限界利益<br/>(限界利益率)</th>
                        <th className="py-2.5 px-2 text-right font-semibold">配賦固定費</th>
                        <th className="py-2.5 px-2 text-right font-semibold">営業利益</th>
                        <th className="py-2.5 px-3 text-right font-semibold bg-emerald-50">利益増減</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {[{ id: 'existing', name: '既存事業', color: 'blue' }, { id: 'commercial', name: '業務用', color: 'amber' }, { id: 'coop', name: '生協・通販', color: 'emerald' }].map(ch => (
                        <tr key={ch.id} className="hover:bg-slate-50/60">
                          <td className="py-2 px-3 font-bold text-slate-700 flex items-center gap-1.5 mt-1.5"><span className={`w-2 h-2 rounded-full bg-${ch.color}-500`}></span>{ch.name}</td>
                          <td className="py-2 px-2 text-right"><span className="font-bold">{fmtInt(currentResult.chSales[ch.id])}</span><span className="text-[10px] ml-0.5">億円</span><br/><span className="text-[10px] text-slate-400">({fmtInt(ratios[ch.id]*100)}%)</span></td>
                          <td className="py-2 px-2 text-right text-slate-600">{fmt(currentResult.chMarginal[ch.id])}<span className="text-[10px] ml-0.5">億円</span><br/><span className="text-[10px] text-slate-400">({fmt(COST_RATES[ch.id].marginalTotal*100)}%)</span></td>
                          <td className="py-2 px-2 text-right text-slate-600">{fmt(currentResult.chFixed[ch.id])}</td>
                          <td className={`py-2 px-2 text-right font-bold ${currentResult.chOpProfit[ch.id] >= 0 ? "text-slate-800" : "text-red-500"}`}>{fmt(currentResult.chOpProfit[ch.id])}</td>
                          <td className="py-2 px-3 text-right font-bold bg-emerald-50/50">{fmtDiff(currentResult.chOpProfit[ch.id] - baseResult.chOpProfit[ch.id])}</td>
                        </tr>
                      ))}
                      <tr className="bg-slate-100 font-bold border-t-2 border-slate-300">
                        <td className="py-2.5 px-3 text-slate-800">全社計</td>
                        <td className="py-2.5 px-2 text-right">{fmt(currentResult.sales)}<span className="font-normal text-[10px]">億円</span></td>
                        <td className="py-2.5 px-2 text-right text-emerald-700">{fmt(currentResult.marginalProfit)}<br/><span className="text-[10px] text-slate-500">({fmt(currentMpRate*100)}%)</span></td>
                        <td className="py-2.5 px-2 text-right">{fmt(currentResult.fixedTotal)}</td>
                        <td className={`py-2.5 px-2 text-right ${currentResult.operatingProfit >= 0 ? "text-emerald-800" : "text-red-600"}`}>{fmt(currentResult.operatingProfit)}</td>
                        <td className="py-2.5 px-3 text-right text-emerald-800 bg-emerald-100/70">{fmtDiff(profitDiff)}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div className="p-2 text-[10px] text-slate-500 bg-white">※各チャネルの売上高は整数表示（四捨五入）のため、合計と一致しない場合があります。</div>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
